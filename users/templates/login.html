{% extends 'messagin_service/base.html' %}

        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}

        <a class="btn btn-primary" href="{% url 'users:password_reset' %}" role="button">Восстановление пароля</a>
        </div>
    </div>
</div>
{% endblock %}
